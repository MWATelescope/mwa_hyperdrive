# Builds and pushes mwatelescope/hyperdrive images on release tags, on demand,
# and on weekday mornings when the bmetrics branch has new commits.
#   cpu:  linux/amd64 + linux/arm64, plain tags (e.g. 0.8.2-bmetrics, latest)
#   cuda: linux/amd64, V100/A100 (e.g. 0.8.2-bmetrics-cuda12.5.1-ubuntu24.04)
#   rocm: linux/amd64, Setonix MI250X (e.g. 0.8.2-bmetrics-rocm6.3.3-ubuntu24.04)
# Each image also gets a <version><features>-<sha7><suffix> tag.
# GPU images are compile-only here: hosted runners have no GPU.
on:
  push:
    tags:
      - "v*"
  # 07:00 AWST (23:00 UTC the day before), Monday to Friday. Builds the
  # SCHEDULED_BRANCH head only if its images aren't on Docker Hub yet.
  # GitHub only runs schedules from the default branch's copy of this file.
  schedule:
    - cron: "0 23 * * 0-4"
  workflow_dispatch:
    inputs:
      version:
        description: "Version for tags (default: tag name without 'v', or branch name)"
        required: false
        default: ""
      features:
        description: "Extra cargo features for every image; 'bmetrics' is also added to the tag"
        required: false
        default: "bmetrics"
      push:
        description: "Push images to Docker Hub"
        type: boolean
        default: true

name: Docker

env:
  REGISTRY_IMAGE: mwatelescope/hyperdrive
  # used for release-tag pushes and schedules, where there are no inputs
  DEFAULT_FEATURES: bmetrics
  # top of the bmetrics PR stack, so it carries every change merged up the stack
  SCHEDULED_BRANCH: bmetrics
  # keep in sync with the gpu matrix suffixes
  GPU_SUFFIXES: cuda12.5.1-ubuntu24.04 rocm6.3.3-ubuntu24.04

jobs:
  tags:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      features: ${{ steps.v.outputs.features }}
      sha: ${{ steps.v.outputs.sha }}
      sha7: ${{ steps.v.outputs.sha7 }}
      latest: ${{ steps.v.outputs.latest }}
      push: ${{ steps.v.outputs.push }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_FEATURES: ${{ inputs.features }}
          INPUT_PUSH: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
        run: |
          sha="$GITHUB_SHA"
          version="$INPUT_VERSION"
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            sha=$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "refs/heads/$SCHEDULED_BRANCH" | cut -f1)
            version=$(curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$sha/Cargo.toml" \
              | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)
          elif [[ -z "$version" ]]; then
            version="${GITHUB_REF_NAME#v}"
            version="${version//\//-}"
          fi
          features="$DEFAULT_FEATURES"
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]] && features="$INPUT_FEATURES"
          if [[ ",$features," == *",bmetrics,"* && "$version" != *bmetrics* ]]; then
            version="${version}-bmetrics"
          fi
          # floating latest tags only for non-prerelease release tags
          latest=false
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            latest=true
          fi
          # a schedule only builds if any image for this commit is missing
          build=true
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            build=false
            for suffix in "" $GPU_SUFFIXES; do
              tag="$version-${sha::7}${suffix:+-$suffix}"
              if ! curl -fsS -o /dev/null "https://hub.docker.com/v2/repositories/$REGISTRY_IMAGE/tags/$tag"; then
                echo "missing $REGISTRY_IMAGE:$tag"
                build=true
              fi
            done
          fi
          {
            echo "version=$version"
            echo "features=$features"
            echo "sha=$sha"
            echo "sha7=${sha::7}"
            echo "latest=$latest"
            echo "push=$INPUT_PUSH"
            echo "build=$build"
          } | tee -a "$GITHUB_OUTPUT"

  cpu:
    needs: tags
    if: needs.tags.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    environment: CI
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux/amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}

      - name: Login to Docker Hub
        if: needs.tags.outputs.push == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        timeout-minutes: 2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ github.server_url }}/${{ github.repository }}.git#${{ needs.tags.outputs.sha }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            FEATURES=${{ needs.tags.outputs.features }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=${{ needs.tags.outputs.push }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  cpu-merge:
    needs: [tags, cpu]
    if: needs.tags.outputs.build == 'true' && needs.tags.outputs.push == 'true'
    runs-on: ubuntu-latest
    environment: CI
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        timeout-minutes: 2

      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          VERSION: ${{ needs.tags.outputs.version }}
          SHA7: ${{ needs.tags.outputs.sha7 }}
          LATEST: ${{ needs.tags.outputs.latest }}
        run: |
          tags=(-t "$REGISTRY_IMAGE:$VERSION" -t "$REGISTRY_IMAGE:$VERSION-$SHA7")
          [[ "$LATEST" == true ]] && tags+=(-t "$REGISTRY_IMAGE:latest")
          sources=()
          for d in *; do sources+=("$REGISTRY_IMAGE@sha256:$d"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$REGISTRY_IMAGE:$VERSION"

  gpu:
    needs: tags
    if: needs.tags.outputs.build == 'true'
    runs-on: ubuntu-24.04
    environment: CI
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cuda
            base: nvidia/cuda:12.5.1-devel-ubuntu24.04
            suffix: cuda12.5.1-ubuntu24.04
            features: cuda
            cuda_compute: "70,80"
            hip_arch: ""
          - name: rocm
            base: quay.io/pawsey/rocm-mpich-base:rocm6.3.3-mpich3.4.3-ubuntu24.04
            suffix: rocm6.3.3-ubuntu24.04
            features: hip
            cuda_compute: ""
            hip_arch: gfx90a
    steps:
      # The ROCm build needs ~50 GB (base is 8 GB compressed, ~35 GB unpacked).
      # Free the root disk, and move docker to /mnt if that has more room.
      - name: Free disk space
        run: |
          sudo docker system prune -af --volumes
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /usr/local/lib/android /usr/share/swift /usr/lib/jvm /usr/local/share/powershell \
            /usr/share/miniconda /opt/hostedtoolcache
          root_free=$(df --output=avail / | tail -1)
          mnt_free=$(df --output=avail /mnt | tail -1)
          if (( mnt_free > root_free )); then
            sudo systemctl stop docker docker.socket
            sudo mkdir -p /mnt/docker /etc/docker
            [[ -s /etc/docker/daemon.json ]] || echo '{}' | sudo tee /etc/docker/daemon.json
            jq '. + {"data-root": "/mnt/docker"}' /etc/docker/daemon.json > /tmp/daemon.json
            sudo mv /tmp/daemon.json /etc/docker/daemon.json
            sudo systemctl start docker
          fi
          df -h / /mnt
          docker info --format 'docker data-root: {{.DockerRootDir}}'

      - name: Tags
        env:
          VERSION: ${{ needs.tags.outputs.version }}
          SHA7: ${{ needs.tags.outputs.sha7 }}
          LATEST: ${{ needs.tags.outputs.latest }}
          SUFFIX: ${{ matrix.suffix }}
        run: |
          {
            echo "TAGS<<EOF"
            echo "$REGISTRY_IMAGE:$VERSION-$SUFFIX"
            echo "$REGISTRY_IMAGE:$VERSION-$SHA7-$SUFFIX"
            [[ "$LATEST" == true ]] && echo "$REGISTRY_IMAGE:$SUFFIX"
            echo "EOF"
          } | tee -a "$GITHUB_ENV"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}

      - name: Login to Docker Hub
        if: needs.tags.outputs.push == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        timeout-minutes: 2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ github.server_url }}/${{ github.repository }}.git#${{ needs.tags.outputs.sha }}
          platforms: linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ env.TAGS }}
          build-args: |
            BASE_IMAGE=${{ matrix.base }}
            FEATURES=${{ matrix.features }}${{ needs.tags.outputs.features && ',' || '' }}${{ needs.tags.outputs.features }}
            CUDA_COMPUTE=${{ matrix.cuda_compute }}
            HIP_ARCH=${{ matrix.hip_arch }}
          push: ${{ needs.tags.outputs.push == 'true' }}
