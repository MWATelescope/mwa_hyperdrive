---
name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# https://matklad.github.io/2021/09/04/fast-rust-builds.html
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-C target-cpu=native -C debuginfo=0 --deny warnings"
  MWA_BEAM_FILE: mwa_full_embedded_element_pattern.h5
  # No GPUs in CI, so only compile CUDA kernels for a single arch rather than
  # every arch nvcc supports. Read by both hyperdrive and hyperbeam.
  HYPERDRIVE_CUDA_COMPUTE: "86"

jobs:
  test:
    name: test (${{ matrix.rust }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, msrv]
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt update -y
          sudo apt install -y \
            tzdata \
            build-essential \
            pkg-config \
            cmake \
            curl \
            git \
            libcfitsio-dev \
            libhdf5-dev \
            ;
          df -h /
        env:
          DEBIAN_FRONTEND: noninteractive

      # Only nvcc and cudart are needed; the network method with sub-packages
      # is much faster than running the full toolkit installer.
      - name: Install CUDA
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: "12.9.1"
          method: network
          sub-packages: '["nvcc", "cudart-dev"]'

      - name: Resolve toolchain
        id: toolchain
        run: |
          if [ "${{ matrix.rust }}" = msrv ]; then
            echo "version=$(grep -m1 "rust-version" Cargo.toml | sed 's|.*\"\(.*\)\".*|\1|')" >> "$GITHUB_OUTPUT"
          else
            echo "version=stable" >> "$GITHUB_OUTPUT"
          fi
          # target-cpu=native differs between runners; don't restore a cache
          # built for CPU features this runner doesn't have.
          echo "cpu=$(rustc --print cfg -C target-cpu=native | grep target_feature | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.version }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ steps.toolchain.outputs.cpu }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Cache MWA beam file
        id: cache-beam
        uses: actions/cache@v5
        with:
          path: mwa_full_embedded_element_pattern.h5
          key: mwa-beam-file-v1

      - name: Download MWA beam file if cache was a miss
        if: steps.cache-beam.outputs.cache-hit != 'true'
        run: |
          curl -fL \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            --retry 5 \
            --retry-delay 10 \
            --retry-all-errors \
            --retry-max-time 120 \
            https://ws.mwatelescope.org/static/mwa_full_embedded_element_pattern.h5 \
            -o mwa_full_embedded_element_pattern.h5

      # Can't test with CUDA, no GPUs available in CI. Can't test with
      # --all-features because cuda and hip aren't allowed together. hip is also
      # difficult to install so ignore it.
      - name: Build with static features
        run: cargo test --locked --release --features=cuda,all-static --no-run

      - name: Build
        if: matrix.rust == 'stable'
        run: cargo test --locked --release --features=cuda --no-run

      - name: Build with gpu-single
        if: matrix.rust == 'msrv'
        run: cargo test --locked --release --features=all-static,cuda,gpu-single --no-run

      - name: Run tests (including ignored)
        if: matrix.rust == 'stable'
        run: cargo test --locked --release -- --include-ignored

      - name: Run tests
        if: matrix.rust == 'msrv'
        run: |
          cargo test --locked --release
          cargo test --locked --release --features=all-static

      - run: df -h /
        if: always()
