name: GPU tests (simulated)

# Optional, non-required check. The runners have no GPU, so this runs the CUDA
# tests on a simulated NVIDIA H100 (https://github.com/pantheongpu/pantheonsim).
# A simulator cannot reproduce hardware-specific behaviour or timing, so it
# complements real-GPU testing and does not replace it.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/gpu/**"
      - "src/model/**"
      - "build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/gpu-sim.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Compile the CUDA kernels for sm_80 (SASS plus compute_80 PTX, which the simulator JITs for the H100). cudart is linked
  # dynamically (the default; the simulator needs a shared cudart).
  HYPERDRIVE_CUDA_COMPUTE: "80"
  MWA_BEAM_FILE: ${{ github.workspace }}/mwa_full_embedded_element_pattern.h5

jobs:
  gpu-tests:
    name: cargo test on a simulated H100
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y pkg-config cmake libcfitsio-dev libhdf5-dev
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Set up the simulated GPU and CUDA toolkit
        uses: pantheongpu/setup-pantheonsim@dda0c8df8d72627c295edbae525354ba2bcb1687 # v0.1.4
        with:
          gpu: nvidia/h100
          cuda-toolkit: "13.0"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Cache MWA beam file
        id: cache-beam
        uses: actions/cache@v5
        with:
          path: mwa_full_embedded_element_pattern.h5
          key: mwa-beam-file-v1

      - name: Download MWA beam file if cache was a miss
        if: steps.cache-beam.outputs.cache-hit != 'true'
        run: |
          curl -fL \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            --retry 5 --retry-delay 10 --retry-all-errors --retry-max-time 120 \
            https://ws.mwatelescope.org/static/mwa_full_embedded_element_pattern.h5 \
            -o mwa_full_embedded_element_pattern.h5

      - name: Build
        run: |
          which nvcc
          cargo test --locked --release --features=cuda --lib --no-run

      # The GPU memory tests and the sky-model tests (CPU and GPU), which are
      # quick. The slower integration tests are not run.
      # model_timestep_autos_with_* are skipped: the simulator rejects the
      # model_autos kernel launch on the H100 profile (136 registers per thread
      # x 512 threads per block exceeds the 65536 registers per block).
      - name: Test
        run: |
          vgpu run --preload cargo test --locked --release --features=cuda --lib -- \
            gpu::tests model::tests --test-threads=1 \
            --skip model::tests::gpu::model_timestep_autos_with_
